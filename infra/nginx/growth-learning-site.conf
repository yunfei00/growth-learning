# Dedicated production virtual host for growth.flycloudjia.xyz.
# The IP/default virtual host remains in sites-enabled/stockpilot so other sites
# and the temporary IP recovery path are unaffected.

server {
    listen 80;
    listen [::]:80;

    server_name growth.flycloudjia.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name growth.flycloudjia.xyz;

    ssl_certificate /etc/letsencrypt/live/growth.flycloudjia.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/growth.flycloudjia.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/growth-learning.conf;
}
