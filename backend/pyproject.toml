[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-learning-backend"
version = "0.1.0"
description = "Growth Learning FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "minio==7.2.20",
  "email-validator==2.3.0",
  "PyJWT==2.13.0",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]==0.3.0",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.0.51",
  "tzdata==2026.3",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
