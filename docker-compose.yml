name: ${COMPOSE_PROJECT_NAME:-growth-learning}

services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - growth_learning

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - growth_learning

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - growth_learning

  backend:
    image: growth-learning-backend:latest
    restart: unless-stopped
    build:
      context: ./backend
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        APP_REVISION: ${APP_REVISION:-unknown}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      DEBUG: "false"
      ROOT_PATH: ${API_ROOT_PATH:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-growth-learning}
      MINIO_SECURE: "false"
      SCIENCE_IMAGE_MAX_BYTES: ${SCIENCE_IMAGE_MAX_BYTES:-10485760}
      SCIENCE_VIDEO_MAX_BYTES: ${SCIENCE_VIDEO_MAX_BYTES:-52428800}
      SCIENCE_AUDIO_MAX_BYTES: ${SCIENCE_AUDIO_MAX_BYTES:-20971520}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-growth_learning_session}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-604800}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite_only}
      INVITATION_CODE_SECRET: ${INVITATION_CODE_SECRET:-}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-10}
      AUTH_REGISTRATION_RATE_LIMIT: ${AUTH_REGISTRATION_RATE_LIMIT:-5}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      LITERACY_ASR_PROVIDER: ${LITERACY_ASR_PROVIDER:-disabled}
      LITERACY_ASR_BASE_URL: ${LITERACY_ASR_BASE_URL:-https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
      LITERACY_ASR_API_KEY: ${LITERACY_ASR_API_KEY:-}
      LITERACY_ASR_MODEL: ${LITERACY_ASR_MODEL:-qwen-audio-3.0-asr-flash}
      LITERACY_ASR_TIMEOUT_SECONDS: ${LITERACY_ASR_TIMEOUT_SECONDS:-15}
      LITERACY_ASR_MAX_AUDIO_BYTES: ${LITERACY_ASR_MAX_AUDIO_BYTES:-2097152}
      CHARACTER_SPEECH_REVIEW_ENABLED: ${CHARACTER_SPEECH_REVIEW_ENABLED:-false}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - growth_learning

  frontend:
    image: growth-learning-frontend:latest
    restart: unless-stopped
    build:
      context: ./frontend
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        APP_REVISION: ${APP_REVISION:-unknown}
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_BASE_PATH: ${PUBLIC_APP_BASE_PATH:-}
        NODE_OPTIONS: ${FRONTEND_BUILD_NODE_OPTIONS:---max-old-space-size=512}
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_BASE_PATH: ${PUBLIC_APP_BASE_PATH:-}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000${PUBLIC_APP_BASE_PATH:-}/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - growth_learning

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  growth_learning:
    driver: bridge