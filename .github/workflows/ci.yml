name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: growth_learning
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: growth_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growth_learning -d growth_learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://growth_learning:ci-postgres-password@localhost:5432/growth_learning
      AI_PROVIDER: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Migrate an empty PostgreSQL database
        run: python -m alembic upgrade head && python -m alembic current

      - name: Verify additive migration from Phase 2 data
        run: |
          python -m alembic downgrade 20260812_0001
          python - <<'PY'
          import asyncio
          import uuid
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.core.config import get_settings

          async def main():
              engine = create_async_engine(get_settings().database_url)
              async with engine.begin() as connection:
                  await connection.execute(
                      text(
                          "INSERT INTO users "
                          "(id, email, display_name, password_hash, is_active) "
                          "VALUES (:id, :email, :name, :password_hash, true)"
                      ),
                      {
                          "id": uuid.UUID("00000000-0000-0000-0000-000000000001"),
                          "email": "migration-fixture@example.com",
                          "name": "Migration Fixture",
                          "password_hash": "test-only-not-a-real-password-hash",
                      },
                  )
              await engine.dispose()

          asyncio.run(main())
          PY
          python -m alembic upgrade head
          python -m alembic current

      - name: Verify migrated PostgreSQL tables
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import inspect, text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.core.config import get_settings

          async def main():
              engine = create_async_engine(get_settings().database_url)
              async with engine.connect() as connection:
                  tables = await connection.run_sync(lambda sync: set(inspect(sync).get_table_names()))
                  legacy_role = await connection.scalar(
                      text("SELECT system_role FROM users WHERE email = :email"),
                      {"email": "migration-fixture@example.com"},
                  )
                  legacy_status = await connection.execute(
                      text(
                          "SELECT account_status, registration_source, is_active, session_version "
                          "FROM users WHERE email = :email"
                      ),
                      {"email": "migration-fixture@example.com"},
                  )
                  legacy_status = legacy_status.one()
              await engine.dispose()
              required = {
                  "users", "families", "family_members", "children", "alembic_version",
                  "knowledge_points", "chinese_characters", "knowledge_relations",
                  "learning_sessions", "learning_records", "assessment_sessions",
                  "assessment_items", "child_knowledge_states",
                  "child_learning_settings", "child_review_schedules",
                  "daily_learning_plans", "daily_plan_items",
                  "assessment_session_plans", "assessment_session_targets",
                  "literacy_estimates",
                  "stories", "story_versions", "story_generation_runs",
                  "story_knowledge_points", "reading_questions",
                  "reading_sessions", "reading_answers", "daily_reading_tasks",
                  "science_experiments", "science_experiment_versions",
                  "experiment_materials", "experiment_material_requirements",
                  "family_materials", "experiment_knowledge_points",
                  "experiment_sessions", "experiment_evidence",
                  "experiment_media_assets",
                  "growth_events", "growth_media_assets",
                  "growth_reports", "growth_report_versions",
                  "growth_books", "growth_book_versions", "export_jobs",
                  "teacher_profiles", "teacher_child_relations", "classrooms",
                  "classroom_memberships", "teacher_assignments",
                  "teacher_assignment_targets", "teacher_assignment_knowledge_points",
                  "teacher_assignment_progress", "teacher_observations",
                  "teacher_observation_knowledge_points",
                  "catalog_releases", "character_catalog_entries",
                  "courses", "course_units", "learning_activities",
                  "activity_knowledge_points", "child_course_enrollments",
                  "course_activity_progress",
                  "achievement_definitions", "child_achievements", "star_ledger",
                  "family_reward_settings", "family_reward_goals",
                  "platform_invitations", "platform_audit_logs",
                  "family_invitations", "adult_child_relations",
              }
              missing = required - tables
              if missing:
                  raise SystemExit(f"Missing migrated tables: {sorted(missing)}")
              if legacy_role != "user":
                  raise SystemExit(f"Existing user received unsafe role: {legacy_role!r}")
              if tuple(legacy_status) != ("active", "legacy", True, 0):
                  raise SystemExit(f"Existing user received unsafe account state: {legacy_status!r}")
              print(f"Verified tables: {sorted(required)}")

          asyncio.run(main())
          PY

      - name: Verify Phase 16 in-place backfill preserves legacy evidence
        run: |
          python -m alembic downgrade 20260826_0015
          python - <<'PY'
          import asyncio
          import json
          import uuid
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.core.config import get_settings

          IDS = {
              "user": uuid.UUID("00000000-0000-0000-0000-000000000001"),
              "family": uuid.UUID("00000000-0000-0000-0000-000000000100"),
              "child": uuid.UUID("00000000-0000-0000-0000-000000000101"),
              "point": uuid.UUID("00000000-0000-0000-0000-000000000102"),
              "learning_session": uuid.UUID("00000000-0000-0000-0000-000000000103"),
              "learning_record": uuid.UUID("00000000-0000-0000-0000-000000000104"),
              "assessment_session": uuid.UUID("00000000-0000-0000-0000-000000000105"),
              "assessment_item": uuid.UUID("00000000-0000-0000-0000-000000000106"),
              "state": uuid.UUID("00000000-0000-0000-0000-000000000107"),
          }

          async def main():
              engine = create_async_engine(get_settings().database_url)
              async with engine.begin() as connection:
                  await connection.execute(text("INSERT INTO families (id, name) VALUES (:id, 'Phase 16 Legacy Family')"), {"id": IDS["family"]})
                  await connection.execute(text("INSERT INTO family_members (family_id, user_id, role) VALUES (:family, :user, 'admin')"), {"family": IDS["family"], "user": IDS["user"]})
                  await connection.execute(text("INSERT INTO children (id, family_id, display_name, birth_date) VALUES (:id, :family, 'Legacy Child', DATE '2021-01-01')"), {"id": IDS["child"], "family": IDS["family"]})
                  await connection.execute(text("INSERT INTO knowledge_points (id, type, status, title, canonical_key, source_type) VALUES (:id, 'chinese_character', 'active', '人', 'zh-char:人', 'legacy-fixture')"), {"id": IDS["point"]})
                  await connection.execute(text("INSERT INTO chinese_characters (knowledge_point_id, character, pinyin, common_words, tags) VALUES (:id, '人', 'rén', CAST(:words AS json), CAST(:tags AS json))"), {"id": IDS["point"], "words": json.dumps(["人民"]), "tags": json.dumps([])})
                  await connection.execute(text("INSERT INTO learning_sessions (id, child_id, actor_user_id, status, source) VALUES (:id, :child, :user, 'completed', 'legacy-fixture')"), {"id": IDS["learning_session"], "child": IDS["child"], "user": IDS["user"]})
                  await connection.execute(text("INSERT INTO learning_records (id, session_id, child_id, knowledge_point_id, actor_user_id, activity_type, source) VALUES (:id, :session, :child, :point, :user, 'introduced', 'legacy-fixture')"), {"id": IDS["learning_record"], "session": IDS["learning_session"], "child": IDS["child"], "point": IDS["point"], "user": IDS["user"]})
                  await connection.execute(text("INSERT INTO assessment_sessions (id, child_id, evaluator_user_id, status, source) VALUES (:id, :child, :user, 'completed', 'quick_recognition')"), {"id": IDS["assessment_session"], "child": IDS["child"], "user": IDS["user"]})
                  await connection.execute(text("INSERT INTO assessment_items (id, session_id, child_id, knowledge_point_id, evaluator_user_id, outcome) VALUES (:id, :session, :child, :point, :user, 'correct')"), {"id": IDS["assessment_item"], "session": IDS["assessment_session"], "child": IDS["child"], "point": IDS["point"], "user": IDS["user"]})
                  await connection.execute(text("INSERT INTO child_knowledge_states (id, child_id, knowledge_point_id, mastery_level, mastery_score, correct_count) VALUES (:id, :child, :point, 'recognizing', 0.25, 1)"), {"id": IDS["state"], "child": IDS["child"], "point": IDS["point"]})
              await engine.dispose()

          asyncio.run(main())
          PY
          python -m alembic upgrade head
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.core.config import get_settings

          async def main():
              engine = create_async_engine(get_settings().database_url)
              async with engine.connect() as connection:
                  point = (await connection.execute(text("SELECT id::text, subject, type FROM knowledge_points WHERE canonical_key = 'zh-char:人'"))).one()
                  state = (await connection.execute(text("SELECT policy_key, state_code, mastery_level, correct_count FROM child_knowledge_states WHERE knowledge_point_id = CAST(:id AS uuid)"), {"id": point.id})).one()
                  learning_count = await connection.scalar(text("SELECT count(*) FROM learning_records WHERE knowledge_point_id = CAST(:id AS uuid)"), {"id": point.id})
                  assessment_count = await connection.scalar(text("SELECT count(*) FROM assessment_items WHERE knowledge_point_id = CAST(:id AS uuid)"), {"id": point.id})
              await engine.dispose()
              assert point.subject == "chinese" and point.type == "chinese_character"
              assert tuple(state) == ("chinese-character-v1", "recognizing", "recognizing", 1)
              assert learning_count == 1 and assessment_count == 1
              print("Phase 16 legacy UUID/evidence/state backfill verified")

          asyncio.run(main())
          PY

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  infrastructure:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate deployment shell syntax
        run: bash -n scripts/*.sh

      - name: Validate Docker Compose configuration
        run: cp .env.example .env && docker compose --env-file .env config --quiet

  deployment-image:
    name: Publish deployment images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production images
        run: |
          docker build \
            --target runtime \
            --build-arg APP_VERSION=1.0.0 \
            --build-arg "APP_REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag growth-learning-backend:latest \
            backend
          docker build \
            --target runtime \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/growth/api \
            --build-arg NEXT_PUBLIC_APP_BASE_PATH=/growth \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag growth-learning-frontend:latest \
            frontend

      - name: Export images
        run: |
          docker save \
            growth-learning-backend:latest \
            growth-learning-frontend:latest | gzip -1 > growth-learning-images.tar.gz

      - name: Publish immutable deployment asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="deployment-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" growth-learning-images.tar.gz --clobber
          else
            gh release create "$tag" growth-learning-images.tar.gz \
              --title "Deployment ${GITHUB_SHA}" \
              --notes "Automated backend and frontend deployment images for commit ${GITHUB_SHA}." \
              --prerelease
          fi
