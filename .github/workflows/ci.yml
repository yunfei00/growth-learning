name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Validate Alembic environment
        run: python -m alembic upgrade head --sql > /tmp/growth-learning-migration.sql

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  infrastructure:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate deployment shell syntax
        run: bash -n scripts/*.sh

      - name: Validate Docker Compose configuration
        run: cp .env.example .env && docker compose --env-file .env config --quiet

  deployment-image:
    name: Publish frontend deployment image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production image
        run: |
          docker build \
            --target runtime \
            --build-arg NEXT_PUBLIC_API_BASE_URL= \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag growth-learning-frontend:latest \
            frontend

      - name: Export image
        run: docker save growth-learning-frontend:latest | gzip -1 > growth-learning-frontend.tar.gz

      - name: Publish immutable deployment asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="deployment-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" growth-learning-frontend.tar.gz --clobber
          else
            gh release create "$tag" growth-learning-frontend.tar.gz \
              --title "Deployment ${GITHUB_SHA}" \
              --notes "Automated frontend deployment image for commit ${GITHUB_SHA}." \
              --prerelease
          fi
